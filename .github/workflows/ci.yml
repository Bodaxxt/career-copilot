name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  frontend-ci:
    name: Frontend CI (Lint, Typecheck & Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier Check
        run: pnpm run format:check

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript Check
        run: pnpm run typecheck

      - name: Run Frontend Unit Tests (Jest)
        run: pnpm --filter web test -- --ci --coverage

  backend-ci:
    name: Backend CI (Flake8, Black & PyTest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Black Formatter Check
        run: black --check apps/api

      - name: Run Flake8 Linter
        run: flake8 apps/api --max-line-length=100

      - name: Run Backend Unit Tests (PyTest)
        working-directory: apps/api
        run: pytest --maxfail=1 --disable-warnings -v
